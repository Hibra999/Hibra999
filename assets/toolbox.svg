<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" role="img" aria-labelledby="title desc">
  <title id="title">Toolbox widget</title>
  <desc id="desc">A local SVG widget listing Israel's core data, forecasting, BI, and app tools.</desc>
  <rect width="1000" height="210" rx="18" fill="#080c10"/>
  <rect x="24" y="24" width="952" height="162" rx="14" fill="#0f1720" stroke="#27384a"/>
  <text x="44" y="62" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#e5f4ff">field kit</text>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="44" y="88" width="110" height="34" rx="8" fill="#1e3a5f"/><text x="68" y="110" fill="#dbeafe">Python</text>
    <rect x="166" y="88" width="82" height="34" rx="8" fill="#244766"/><text x="193" y="110" fill="#dbeafe">SQL</text>
    <rect x="260" y="88" width="58" height="34" rx="8" fill="#1f3b73"/><text x="283" y="110" fill="#dbeafe">R</text>
    <rect x="330" y="88" width="112" height="34" rx="8" fill="#7c5c00"/><text x="356" y="110" fill="#fff7cc">Power BI</text>
    <rect x="454" y="88" width="70" height="34" rx="8" fill="#0f5148"/><text x="477" y="110" fill="#ccfbf1">SAP</text>
    <rect x="536" y="88" width="94" height="34" rx="8" fill="#6d2630"/><text x="558" y="110" fill="#ffe4e6">Access</text>
    <rect x="642" y="88" width="96" height="34" rx="8" fill="#075f5a"/><text x="665" y="110" fill="#ccfbf1">FastAPI</text>
    <rect x="750" y="88" width="80" height="34" rx="8" fill="#243244"/><text x="773" y="110" fill="#e5e7eb">Flask</text>
    <rect x="842" y="88" width="90" height="34" rx="8" fill="#1d4f73"/><text x="865" y="110" fill="#dbeafe">Docker</text>
  </g>
  <text x="44" y="154" font-family="Consolas, Menlo, monospace" font-size="16" fill="#93c5fd">forecasting: Prophet / sktime / Darts / StatsForecast / PyTorch Forecasting / TimesFM</text>
</svg>
