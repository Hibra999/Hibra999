<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" role="img" aria-labelledby="title desc">
  <title id="title">Toolbox widget</title>
  <desc id="desc">A local SVG widget listing Israel's core data, forecasting, BI, and app tools.</desc>
  <rect width="1000" height="210" rx="18" fill="#f6f8fa"/>
  <rect x="24" y="24" width="952" height="162" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="44" y="62" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101820">Toolbox</text>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="44" y="88" width="110" height="34" rx="8" fill="#3776ab"/><text x="68" y="110" fill="#fff">Python</text>
    <rect x="166" y="88" width="82" height="34" rx="8" fill="#336791"/><text x="193" y="110" fill="#fff">SQL</text>
    <rect x="260" y="88" width="58" height="34" rx="8" fill="#276dc3"/><text x="283" y="110" fill="#fff">R</text>
    <rect x="330" y="88" width="112" height="34" rx="8" fill="#f2c811"/><text x="356" y="110" fill="#111">Power BI</text>
    <rect x="454" y="88" width="70" height="34" rx="8" fill="#0f766e"/><text x="477" y="110" fill="#fff">SAP</text>
    <rect x="536" y="88" width="94" height="34" rx="8" fill="#a4373a"/><text x="558" y="110" fill="#fff">Access</text>
    <rect x="642" y="88" width="96" height="34" rx="8" fill="#009688"/><text x="665" y="110" fill="#fff">FastAPI</text>
    <rect x="750" y="88" width="80" height="34" rx="8" fill="#111827"/><text x="773" y="110" fill="#fff">Flask</text>
    <rect x="842" y="88" width="90" height="34" rx="8" fill="#2496ed"/><text x="865" y="110" fill="#fff">Docker</text>
  </g>
  <text x="44" y="154" font-family="Consolas, Menlo, monospace" font-size="16" fill="#57606a">forecasting: Prophet / sktime / Darts / StatsForecast / PyTorch Forecasting / TimesFM</text>
</svg>
